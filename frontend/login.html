<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập Quản Trị</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center"
    style="height: 100vh"
  >
    <div class="card shadow border-0" style="width: 400px">
      <div class="card-body p-4">
        <h3 class="text-center mb-4 text-primary fw-bold">ĐĂNG NHẬP</h3>

        <form id="login-form">
          <div class="mb-3">
            <label class="form-label fw-bold">Tài khoản</label>
            <input
              type="text"
              id="username"
              class="form-control"
              required
              placeholder="Nhập admin..."
            />
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold">Mật khẩu</label>
            <input
              type="password"
              id="password"
              class="form-control"
              required
              placeholder="Nhập mật khẩu..."
            />
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-bold">
            Đăng Nhập
          </button>
        </form>

        <div id="login-alert" class="mt-3"></div>
        <div class="text-center mt-3">
          <a href="index.html" class="text-decoration-none text-secondary"
            >Về trang chủ</a
          >
        </div>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
